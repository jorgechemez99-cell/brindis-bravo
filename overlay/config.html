<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Servidor del chat</title>
<style>
  body { margin: 0; padding: 20px; background: #101016; color: #f4f4f8; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  label { display: grid; gap: 6px; color: #a3a3b5; }
  input { font: inherit; font-size: 15px; color: #f4f4f8; background: #0c0c11; border: 1px solid #2c2c3a; border-radius: 8px; padding: 9px 11px; outline: none; }
  input:focus { border-color: #ff3d7f; }
  .botones { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
  button { font: inherit; font-weight: 700; color: #fff; border: 0; border-radius: 8px; padding: 8px 16px; cursor: pointer; background: linear-gradient(90deg, #ff3d7f, #ff6a4d); }
  button.sec { background: #2a2a38; }
  #error { color: #ff5a5a; min-height: 1.2em; margin-top: 8px; }
</style>
</head>
<body>
<form id="f">
  <label>Dirección del servidor del chat
    <input id="url" spellcheck="false" placeholder="https://brindis-bravo.ejemplo.workers.dev">
  </label>
  <div id="error"></div>
  <div class="botones">
    <button type="button" class="sec" onclick="window.close()">Cancelar</button>
    <button>Guardar</button>
  </div>
</form>
<script>
  window.overlay.leerServidor().then((u) => (document.getElementById("url").value = u || ""));
  document.getElementById("f").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    document.getElementById("error").textContent = await window.overlay.guardarServidor(document.getElementById("url").value);
  });
</script>
</body>
</html>
